[package]
name = "npc"
version = "0.5.13"
edition = "2021"
description = "Terminal photo catalog: tag, rate and browse a library without ever writing to the originals"

[[bin]]
name = "npc"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
rayon = "1"
directories = "5"
rustix = { version = "0.38", features = ["fs"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
blake3 = "1"
ratatui = { version = "0.29", features = ["serde"] }
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# SIMD resampling: the same Lanczos3 as `image`, 31 ms instead of 640 ms for
# a 24 MP JPG down to the view size.
fast_image_resize = { version = "6", features = ["image"] }
ratatui-image = "4"
eframe = "0.36.1"
egui = "0.36.1"
env_logger = "0.11"
arboard = "3"
winit = "0.30"

[build-dependencies]
cxx-build = "1.0"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
walkdir = "2"

# No LTO, incremental on. With thin LTO and cargo's default (no incremental
# for release), a one-line edit took 206 s to rebuild: the whole npc crate
# recompiled at -O3, then re-optimised against every dependency at link time.
# Now 2-3 s. Measured at runtime too: exporting the test photos takes 2.7 s
# either way -- the heavy work is Exiv2, libjpeg, SQLite and SIMD resizing,
# none of which LTO reaches.
[profile.release]
opt-level = 3
lto = false
incremental = true

# What `./check` builds and runs tests under. Now the same settings as
# release; kept as its own profile so test builds land in their own target
# directory and never invalidate the release build's incremental state (or
# the other way round).
[profile.release-nolto]
inherits = "release"
lto = false

# Lint level lives here rather than only in `check`, so `cargo build`, `cargo
# test` and your editor all enforce the same bar. `check` adds `-D warnings`,
# which promotes everything below to an error there.
#
# The allows are triaged, not blanket: each one is a lint whose value does not
# survive contact with this crate. Anything not listed is expected to be fixed
# rather than silenced -- and a site-local `#[allow]` should carry a reason.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# A binary crate with one consumer. Documenting the error type of every internal
# `Result` and marking every getter `#[must_use]` is ceremony that would bury the
# comments that do carry weight.
missing_errors_doc = "allow"
must_use_candidate = "allow"

# The prose here is deliberate and frequently names things that are not code:
# camera models, file extensions, RawTherapee. Backticking them all reads worse.
doc_markdown = "allow"

# Every occurrence is an integer widened to f64 to print a human-readable rate
# or size -- "1790 files in 23s" and "98 MB". Losing precision past 2^53 files
# is not a failure mode this program has.
cast_precision_loss = "allow"

# The largest functions are the TUI event loop and the scan pipeline, both of
# which are a long flat sequence of cases. Splitting them to satisfy a line
# count would scatter one readable narrative across a dozen helpers.
too_many_lines = "allow"
