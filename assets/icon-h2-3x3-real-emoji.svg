<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="#1c2028"/>

  <!-- Catalog: a 3x3 grid of prints, using real Twemoji images (CC-BY 4.0,
